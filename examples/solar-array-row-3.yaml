# Sample checkpoint: a row of solar modules. `module-tilt` depends on the
# measured input `tilt_angle_deg`; with no measurer registered it is reported
# not_assessable.
id: solar-array-row-3
site: Tarapaca PV plant, block B
vantage: >
  Standing at the north end of row 3, camera at chest height, facing south along
  the row. The first four modules fill the frame.
reference_image: images/reference.jpg
notes: >
  Commissioning reference, taken after the row passed manual inspection.

checks:
  - id: module-tilt
    rule: >
      All modules in frame sit at the design tilt of 25 degrees, within a 2 degree
      tolerance.
    # Tilt comes from an inclinometer or a geometric calculation and is passed
    # to the model as a fact. Without it, this check is reported not_assessable.
    requires_measured: tilt_angle_deg

  - id: surface-soiling
    rule: >
      Module surfaces are free of heavy soiling, bird droppings or sand
      accumulation covering more than roughly a tenth of any single module.

  - id: cable-management
    rule: >
      DC cabling is clipped to the rail and off the ground. No cable hangs loose
      or rests in the dirt.

  - id: visible-damage
    rule: >
      No cracked glass, delamination, burn marks or bent frames on any module in
      frame.
